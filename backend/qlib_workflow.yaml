# qlib alpha158 + LightGBM 工作流（微软官方标准流程，适配 A 股 + 本地数据）
# 用法: python qlib_workflow.py  [在项目 backend 目录]
qlib_init:
  provider_uri: "E:/AI项目/stock-mobile/backend/qlib_data/bin"
  region: cn

market: &market csi300
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
  start_time: 2026-01-01   # 数据从 2025-08 开始，训练窗口从 2026-01
  end_time: 2026-08-15
  fit_start_time: 2026-01-01
  fit_end_time: 2026-06-30
  instruments: *market
  infer_processors: &infer_processors
    - class: RobustZScoreNorm
      kwargs:
        fields_group: feature
        clip_outlier: true
    - class: Fillna
      kwargs:
        fields_group: feature
  learn_processors: &learn_processors
    - class: DropnaLabel
    - class: CSRankNorm
      kwargs:
        fields_group: label
  label: &label ["Ref($close, -20) / Ref($close, -1) - 1"]

port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 5
  backtest:
    start_time: 2026-07-01
    end_time: 2026-08-15
    account: 100000000
    benchmark: *benchmark
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5

task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.0421
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 20
      verbosity: -1
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: qlib.contrib.data.handler
        kwargs: *data_handler_config
      segments:
        train: [2026-01-01, 2026-06-30]
        valid: [2026-07-01, 2026-07-31]
        test: [2026-08-01, 2026-08-15]
  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        model: <MODEL>
        dataset: <DATASET>
    - class: SigAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        ana_long_short: false
        ann_scaler: 252
    - class: PortAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        config: *port_analysis_config
